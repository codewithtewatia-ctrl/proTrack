# ========================================================
# ProTrack Mail & OTP Dispatch Configuration
# ========================================================
# To dispatch real OTP emails to users' inboxes (Gmail, Yahoo, Outlook, etc.):
# Set mail.smtp.enabled=true and provide your sender SMTP credentials below.
#
# For Gmail:
# 1. Enable 2-Step Verification in your Google Account.
# 2. Generate a 16-character App Password at: https://myaccount.google.com/apppasswords
# 3. Enter your email in mail.smtp.username and the 16-character code in mail.smtp.password
# ========================================================
mail.smtp.enabled=true
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.smtp.ssl.enable=false

# Sender Email Address:
mail.smtp.username=

# Sender App Password (16 letters, spaces optional):
mail.smtp.password=

# From Header Information:
mail.from.email=
mail.from.name=ProTrack Enterprise Security
